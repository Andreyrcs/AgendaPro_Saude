<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Entrar - AgendaPro Saúde</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='26' rx='7' fill='%2312263f'/%3E%3Cpath d='M2 12v-1a7 7 0 0 1 7-7h14a7 7 0 0 1 7 7v1z' fill='%23a8e6cf'/%3E%3Crect x='14.2' y='14.5' width='3.6' height='11.5' rx='1.2' fill='%23fff'/%3E%3Crect x='10.25' y='18.45' width='11.5' height='3.6' rx='1.2' fill='%23fff'/%3E%3C/svg%3E" />
        <meta name="theme-color" content="#12263f" />
        <link
            rel="preload"
            href="assets/fonts/atkinson-next-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="assets/fonts/archivo-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="assets/css/tokens.css" />
        <link rel="stylesheet" href="assets/css/acesso.css" />
    </head>
    <body>
        <div class="acesso">
            <header class="acesso__topo">
                <a
                    href="index.html"
                    class="acesso__marca"
                    aria-label="AgendaPro Saúde - página inicial"
                >
                    <span data-marca="28"></span>
                    <span class="acesso__marca-nome">AgendaPro Saúde</span>
                </a>
            </header>

            <main class="acesso__corpo">
                <div class="cartao-acesso">
                    <div class="container-acesso__conteudo">
                        <span class="acesso__marca-logo" data-marca="28"></span>
                        <h1 class="cartao-acesso__titulo">Entrar</h1>
                    </div>
                    <p class="cartao-acesso__sub">
                        Acesse sua conta para continuar.
                    </p>

                    <div class="erro-geral" id="erro-geral" role="alert">
                        <svg
                            class="ic ic-sm"
                            aria-hidden="true"
                            focusable="false"
                        >
                            <use href="#i-alert-circle" />
                        </svg>
                        <span id="erro-geral-texto"></span>
                    </div>

                    <form id="form-login" novalidate>
                        <div class="campo">
                            <label class="campo__rotulo" for="email"
                                >E-mail</label
                            >
                            <input
                                class="campo__entrada"
                                id="email"
                                name="email"
                                type="email"
                                placeholder="seu@email.com"
                                autocomplete="email"
                                required
                            />
                            <span
                                class="campo__erro"
                                id="erro-email"
                                aria-live="polite"
                            ></span>
                        </div>

                        <!-- Senha -->
                        <div class="campo">
                            <label class="campo__rotulo" for="senha"
                                >Senha</label
                            >
                            <div class="campo__senha-wrap">
                                <input
                                    class="campo__entrada"
                                    id="senha"
                                    name="senha"
                                    type="password"
                                    placeholder="Sua senha"
                                    autocomplete="current-password"
                                    required
                                />
                                <button
                                    type="button"
                                    class="campo__senha-ver"
                                    id="btn-ver-senha"
                                    aria-label="Mostrar senha"
                                    title="Mostrar senha"
                                >
                                    <svg
                                        class="ic ic-sm"
                                        aria-hidden="true"
                                        focusable="false"
                                    >
                                        <use href="#i-eye" />
                                    </svg>
                                </button>
                            </div>
                            <span
                                class="campo__erro"
                                id="erro-senha"
                                aria-live="polite"
                            ></span>
                        </div>

                        <!-- Manter conectado -->
                        <div
                            style="
                                display: flex;
                                align-items: center;
                                justify-content: space-between;
                                margin-bottom: 24px;
                                flex-wrap: wrap;
                                gap: 8px;
                            "
                        >
                            <label class="check">
                                <input
                                    type="checkbox"
                                    id="manter"
                                    name="manter"
                                />
                                Manter conectado
                            </label>
                        </div>

                        <!-- Botão principal -->
                        <button
                            type="submit"
                            class="btn btn--principal"
                            id="btn-entrar"
                        >
                            Entrar
                        </button>
                    </form>

                    <!-- Acesso rápido: entra com as contas da carga inicial (útil na apresentação) -->
                    <div class="separador"><span>Acesso rápido</span></div>
                    <div class="demos" aria-label="Acesso rápido">
                        <button type="button" class="demo-btn" data-demo="recepcao">
                            <span class="demo-btn__icone demo-btn__icone--recepcao" aria-hidden="true">CM</span>
                            <span class="demo-btn__texto"><span class="demo-btn__nome">Carla Mendes</span><span class="demo-btn__perfil">Recepção · Clínica Ipê</span></span>
                        </button>
                        <button type="button" class="demo-btn" data-demo="medico">
                            <span class="demo-btn__icone demo-btn__icone--medico" aria-hidden="true">PM</span>
                            <span class="demo-btn__texto"><span class="demo-btn__nome">Dr. Paulo Menezes</span><span class="demo-btn__perfil">Médico · Cardiologia</span></span>
                        </button>
                        <button type="button" class="demo-btn" data-demo="paciente">
                            <span class="demo-btn__icone demo-btn__icone--paciente" aria-hidden="true">JS</span>
                            <span class="demo-btn__texto"><span class="demo-btn__nome">Juliana Santos</span><span class="demo-btn__perfil">Paciente</span></span>
                        </button>
                        <button type="button" class="demo-btn" data-demo="recepcaoJacaranda">
                            <span class="demo-btn__icone demo-btn__icone--recepcao" aria-hidden="true">MF</span>
                            <span class="demo-btn__texto"><span class="demo-btn__nome">Marta Ferraz</span><span class="demo-btn__perfil">Recepção · Clínica Jacarandá</span></span>
                        </button>
                    </div>

                    <!-- Link para cadastro -->
                    <p class="cartao-acesso__rodape">
                        Não tem conta?
                        <a href="cadastro.html" class="acesso-link"
                            >Cadastre-se</a
                        >
                    </p>
                    <p class="cartao-acesso__rodape cartao-acesso__rodape--clinica">
                        É dono de uma clínica?
                        <a href="cadastro-clinica.html" class="acesso-link">Cadastre sua clínica</a>
                    </p>
                </div>
            </main>
        </div>

        <!-- Toast -->
        <div
            class="toast-acesso"
            id="toast"
            role="status"
            aria-live="polite"
        ></div>

        <!-- Anunciador para leitores de tela -->
        <div
            id="anunciador"
            aria-live="polite"
            class="visualmente-oculto"
        ></div>

        <!-- Ícones (inline subset) -->
        <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
            <symbol
                id="i-eye"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                />
                <circle cx="12" cy="12" r="3" />
            </symbol>
            <symbol
                id="i-eye-off"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
                />
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                <path
                    d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
                />
                <path d="m2 2 20 20" />
            </symbol>
            <symbol
                id="i-alert-circle"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </symbol>
            <symbol
                id="i-info"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
            </symbol>
        </svg>

        <script src="assets/js/dados.js"></script>
        <script src="assets/js/api.js"></script>
        <script src="assets/js/comum.js"></script>
        <script src="assets/js/login.js"></script>
    </body>
</html>
